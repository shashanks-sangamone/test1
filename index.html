<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Card</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: #f3f6fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 680px);
      overflow: hidden;
      background: #fff;
      border: 1px solid #e1e7ef;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgb(23 32 51 / 8%);
    }

    header {
      padding: 32px 28px;
      text-align: center;
      color: #fff;
      background: #123b65;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #c9dcf1;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 2rem);
      line-height: 1.3;
    }

    .location {
      margin: 8px 0 0;
      color: #dce8f5;
      font-size: 0.95rem;
    }

    section {
      padding: 28px;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 1.1rem;
    }

    dl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 0;
    }

    .detail {
      padding: 16px;
      background: #f6f8fb;
      border: 1px solid #e8edf3;
      border-radius: 10px;
    }

    dt {
      margin-bottom: 7px;
      color: #5c6879;
      font-size: 0.82rem;
      font-weight: 700;
    }

    dd {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    footer {
      padding: 0 28px 24px;
      color: #697586;
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      header,
      section {
        padding: 24px 20px;
      }

      dl {
        grid-template-columns: 1fr;
      }

      footer {
        padding: 0 20px 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Student Profile</p>
      <h1>Shri Madhwa Vadiraja Institute of Technology &amp; Management</h1>
      <p class="location">Bantakal, Udupi</p>
    </header>

    <section aria-labelledby="details-heading">
      <!--
        To edit student details:
        - Open this file (index.html) and replace the text inside the <dd> elements below.
        - For in-browser quick edits during the session, you can click the values (they are editable).
      -->
      <h2 id="details-heading">Student Details</h2>
      <dl>
        <div class="detail">
          <dt>Student Name</dt>
          <dd id="student-name" contenteditable="true" aria-label="Student name">Enter student name</dd>
        </div>
        <div class="detail">
          <dt>USN</dt>
          <dd id="student-usn" contenteditable="true" aria-label="USN">Enter USN</dd>
        </div>
        <div class="detail">
          <dt>Branch</dt>
          <dd id="student-branch" contenteditable="true" aria-label="Branch">Enter branch</dd>
        </div>
      </dl>
    </section>
  </main>
</body>
</html>
